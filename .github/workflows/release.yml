name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist), e.g. v0.1.0"
        required: true

env:
  GODOT_VERSION: "4.7-stable"
  GAME_NAME: "Heliograph"

permissions:
  contents: write

jobs:
  export:
    name: Export game (all platforms)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Export all platforms
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          archive_output: false
          cache: true
          verbose: true

      - name: Package platform archives
        run: |
          set -euo pipefail

          mkdir -p dist
          VERSION="${{ steps.ref.outputs.version }}"

          echo "Workspace files:"
          find . -maxdepth 5 -type f | sort

          echo "Builds files:"
          find builds -maxdepth 5 -type f | sort

          test -f builds/linux/Heliograph.x86_64
          test -f builds/windows/Heliograph.exe
          test -f builds/macos/Heliograph.zip

          chmod +x builds/linux/Heliograph.x86_64

          (cd builds/linux && zip -r "../../dist/${GAME_NAME}-${VERSION}-linux-x86_64.zip" .)
          (cd builds/windows && zip -r "../../dist/${GAME_NAME}-${VERSION}-windows-x86_64.zip" .)
          cp builds/macos/Heliograph.zip "dist/${GAME_NAME}-${VERSION}-macos-universal.zip"

          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: dist/*.zip
          retention-days: 7

  changelog:
    name: Build release notes
    runs-on: ubuntu-latest
    needs: export
    outputs:
      version: ${{ steps.ref.outputs.version }}
    steps:
      - name: Resolve ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: .github/scripts/build_release_notes.sh "${{ steps.ref.outputs.version }}"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [export, changelog]
    steps:
      - name: Resolve version
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ref.outputs.version }}
          name: "${{ env.GAME_NAME }} ${{ steps.ref.outputs.version }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/*.zip
