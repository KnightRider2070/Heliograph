name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist), e.g. v0.1.0"
        required: true

env:
  GODOT_VERSION: "4.7-stable"
  GAME_NAME: "Heliograph"

permissions:
  contents: write

jobs:
  export:
    name: Export game (all platforms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Export all platforms
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          archive_output: false
          cache: true
          verbose: true

      - name: Package platform archives
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"

          (cd builds/linux && zip -r "../../dist/${GAME_NAME}-${VERSION}-linux-x86_64.zip" .)
          (cd builds/windows && zip -r "../../dist/${GAME_NAME}-${VERSION}-windows-x86_64.zip" .)
          cp builds/macos/Heliograph.zip "dist/${GAME_NAME}-${VERSION}-macos-universal.zip"

          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*.zip
          retention-days: 7

  changelog:
    name: Build release notes
    runs-on: ubuntu-latest
    needs: export
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: .github/scripts/build_release_notes.sh "${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [export, changelog]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "${{ env.GAME_NAME }} ${{ github.event.inputs.tag || github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/*.zip
